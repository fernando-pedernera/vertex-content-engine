[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-content-engine"
version = "1.0.0"
description = "Autonomous AI Creator Content Engine: Headless ComfyUI + Character LoRA + Wan 2.1/Kling I2V + VLM Quality Gate + MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
